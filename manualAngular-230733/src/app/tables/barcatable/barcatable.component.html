<!-- barcatable.component.html -->
<div class="gradient-border">
  <div class="scroll-container">
    <div class="table-container">
      <div class="controls">
        <input 
          type="text" 
          placeholder="Filtrar jugadores..." 
          (input)="filterTable($event)"
          class="filter-input"
          aria-label="Filtrar jugadores"
        >
        
        <select 
          (change)="changePageSize($event)" 
          class="page-size-select"
          aria-label="Elementos por página"
        >
          <option value="3">3 por página</option>
          <option value="5" selected>5 por página</option>
          <option value="10">10 por página</option>
          <option value="20">20 por página</option>
        </select>
      </div>

      <table class="players-table" aria-label="Tabla de jugadores del Barcelona">
        <thead>
          <tr>
            <th (click)="sortTable('name')" scope="col">
              Nombre 
              <span *ngIf="sortDirection.name === 'asc'">↑</span>
              <span *ngIf="sortDirection.name === 'desc'">↓</span>
            </th>
            <!-- Resto de columnas con el mismo patrón -->
          </tr>
        </thead>
        <tbody>
          <tr 
            *ngFor="let player of paginatedData" 
            [class.disabled]="isRowDisabled(player.name)"
            [attr.aria-disabled]="isRowDisabled(player.name)"
          >
            <td>{{ player.name }}</td>
            <!-- Resto de celdas -->
            <td>
              <button 
                (click)="toggleRow(player.name)" 
                class="toggle-btn"
                [attr.aria-label]="isRowDisabled(player.name) ? 'Activar fila' : 'Desactivar fila'"
              >
                {{ isRowDisabled(player.name) ? 'Activar' : 'Desactivar' }}
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="pagination-controls">
        <button 
          (click)="previousPage()" 
          [disabled]="currentPage === 1"
          class="page-btn"
          aria-label="Página anterior"
        >
          Anterior
        </button>
        
        <span aria-live="polite">Página {{ currentPage }} de {{ totalPages }}</span>
        
        <button 
          (click)="nextPage()" 
          [disabled]="currentPage === totalPages"
          class="page-btn"
          aria-label="Página siguiente"
        >
          Siguiente
        </button>
      </div>
    </div>
  </div>
</div>
